<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kavinesh // Communication & Signal Processing Engineer</title>
  <meta name="description" content="Personal website of Kavinesh – Communication & Signal Processing Engineer.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="site-header">
    <nav class="nav-bar">
      <div class="brand">KAVINESH</div>
      <ul class="nav-links">
        <li><button class="nav-btn active" data-target="about">About</button></li>
        <li><button class="nav-btn" data-target="projects">Projects</button></li>
        <li><button class="nav-btn" data-target="cv">CV</button></li>
        <li><button class="nav-btn" data-target="blog">Blog</button></li>
      </ul>
      <button class="theme-btn" id="theme-toggle">[ light ]</button>
    </nav>
  </header>

  <main>

    <!-- ABOUT -->
    <section id="about" class="view-section active-view">
      <div class="about-grid">
        <div>
          <img src="assets/profile.jpg" alt="Profile photo" id="profile-img" class="profile-photo">
        </div>
        <div>
          <h1 class="about-name" id="about-name">Kavinesh</h1>
          <div class="about-title" id="about-title">Communication & Signal Processing Engineer</div>
          <div class="about-bio" id="about-bio"></div>
          <div class="social-list" id="social-links"></div>
        </div>
      </div>
      <hr class="divider">
      <div class="skills-label">&gt; skills</div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="view-section">
      <h2 class="section-title">&gt; projects</h2>
      <div class="projects-list" id="projects-list"></div>
    </section>

    <!-- CV -->
    <section id="cv" class="view-section">
      <div class="cv-print-row">
        <h2 class="section-title" style="border:none;margin:0;padding:0;">&gt; curriculum vitae</h2>
        <button class="print-btn" id="print-btn">[ print / save pdf ]</button>
      </div>
      <div class="cv-sub">&gt; experience</div>
      <div class="timeline" id="exp-timeline"></div>
      <div class="cv-sub">&gt; education</div>
      <div class="timeline" id="edu-timeline"></div>
    </section>

    <!-- BLOG INDEX -->
    <section id="blog" class="view-section">
      <h2 class="section-title">&gt; blog</h2>
      <div class="blog-list" id="blog-list"></div>
    </section>

    <!-- BLOG POST (single post full-page view) -->
    <section id="blogpost" class="view-section">
      <div class="blog-post-view" id="blogpost-content"></div>
    </section>

  </main>

  <footer class="site-footer">
    "It's okay to fail, the earlier the better."
    <br> -Dr. Giridhar
  </footer>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
